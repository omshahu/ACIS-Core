<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACIS-Core | Operator Authentication Gateway</title>
    <!-- Brand Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="assets/favicon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css?v=2.3">
    <!-- Unified Configuration Resolver -->
    <script src="js/config.js?v=2.3"></script>
</head>

<body>

    <!-- Top Theme Switcher -->
    <div class="top-nav-bar">
        <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
            <i class="fas fa-moon" id="themeIcon"></i>
            <span id="themeLabel">Dark</span>
        </button>
    </div>

    <!-- Main Authentication Gateway Card -->
    <div class="login-card">
        <!-- Left Brand & Clearance Panel -->
        <aside class="card-left">
            <div>
                <div class="brand-header">
                    <div class="brand-logo-wrap">
                        <img src="assets/acis-shield.png" alt="ACIS Emblem" class="brand-logo-img">
                    </div>
                    <div>
                        <h1 class="brand-title">ACIS-Core</h1>
                        <span class="brand-subtitle">Cyberimmune Defense</span>
                    </div>
                </div>

                <div class="shield-container">
                    <div class="hero-logo-wrapper">
                        <img src="assets/acis-logo-darkmode.png" alt="ACIS Autonomous Cyber Immune System" class="shield-hero-logo logo-dark">
                        <img src="assets/acis-logo-transparent.png" alt="ACIS Autonomous Cyber Immune System" class="shield-hero-logo logo-light">
                    </div>

                    <div class="gateway-badge-group">
                        <div class="classification-badge">
                            <span class="dot"></span>
                            <span>Level 5 Clearance</span>
                        </div>
                        <div class="gateway-status">
                            <span class="status-dot"></span>
                            <span>Gateway Status: Operational</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="left-footer">
                <div>Autonomous Cyberimmune Intelligence Platform</div>
                <div style="color:var(--login-text-muted); font-size:0.68rem; margin-top:3px;">SOC Telemetry & Cryptographic Audit Grid</div>
            </div>
        </aside>

        <!-- Right Authentication Form Panel -->
        <main class="card-right">
            <div class="form-header-wrap">
                <h2 class="form-title">Operator Authentication</h2>
                <p class="form-subtitle">Enter verified credentials to access the cyberimmune control center.</p>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <label for="username">Operator Email / Identity</label>
                    <div class="input-field-wrap">
                        <i class="fas fa-user-shield"></i>
                        <input type="text" id="username" required placeholder="admin@cyberimmune.ai" value="admin@cyberimmune.ai">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Security Password</label>
                    <div class="input-field-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required placeholder="••••••••••••" value="SecurePass123">
                    </div>
                </div>

                <div class="input-group">
                    <label for="role">Clearance Authority</label>
                    <div class="input-field-wrap">
                        <i class="fas fa-id-badge"></i>
                        <select id="role">
                            <option value="SecOps Administrator (Level 5)" selected>SecOps Administrator (Level 5)</option>
                            <option value="Cyber Analyst (Level 4)">Cyber Analyst (Level 4)</option>
                            <option value="Security Engineer (Level 3)">Security Engineer (Level 3)</option>
                            <option value="Observer (Level 2)">Observer (Level 2)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="loginBtn">
                    <i class="fas fa-key"></i>
                    <span>Authenticate Operator</span>
                </button>
            </form>

            <div class="form-footer-actions">
                <button type="button" class="quick-demo-btn" onclick="quickDemoLogin()" title="Instant access using pre-configured SecOps credentials">
                    <i class="fas fa-bolt"></i>
                    <span>Quick Demo Login</span>
                </button>

                <a href="#" class="forgot-link" onclick="quickDemoLogin(); return false;">Forgot Password?</a>
            </div>
        </main>
    </div>

    <script>
        // ── Theme State Management ──
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('acis-theme', theme);
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            if (icon && label) {
                if (theme === 'dark') {
                    icon.className = 'fas fa-moon';
                    label.textContent = 'Dark';
                } else {
                    icon.className = 'fas fa-sun';
                    label.textContent = 'Light';
                }
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        }

        // Initialize Theme from localStorage
        const savedTheme = localStorage.getItem('acis-theme') || 'dark';
        applyTheme(savedTheme);

        // ── Authentication Form Submission ──
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Authenticating...</span>';
            btn.disabled = true;

            const usernameInput = document.getElementById('username').value.trim() || 'admin';
            const roleInput = document.getElementById('role').value || 'SecOps Administrator (Level 5)';

            const userData = {
                user: usernameInput.includes('@') ? usernameInput.split('@')[0] : usernameInput,
                email: usernameInput.includes('@') ? usernameInput : `${usernameInput}@cyberimmune.ai`,
                role: roleInput
            };

            try {
                const apiBase = (window.ACIS_CONFIG && window.ACIS_CONFIG.getApiBase) 
                    ? window.ACIS_CONFIG.getApiBase() 
                    : 'http://127.0.0.1:5001/api';

                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    // Update button label if waiting on cloud cold-start
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Connecting Cloud SOC...</span>';
                }, 1500);

                const abortTimeout = setTimeout(() => controller.abort(), 4000);

                const res = await fetch(`${apiBase}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                clearTimeout(abortTimeout);

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('user', JSON.stringify(data.success ? data : userData));
                } else {
                    localStorage.setItem('user', JSON.stringify(userData));
                }
            } catch (err) {
                // Seamless demo fallback if cloud backend is cold-starting or offline
                console.log('[Login] Proceeding with authenticated SecOps session (offline/demo resilience)');
                localStorage.setItem('user', JSON.stringify(userData));
            }

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        });

        function quickDemoLogin() {
            const defaultUser = {
                user: 'admin',
                email: 'admin@cyberimmune.ai',
                role: 'SecOps Administrator (Level 5)'
            };
            localStorage.setItem('user', JSON.stringify(defaultUser));
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
