<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACIS-Core | Operator Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #F1F5F9;
            --bg-card: #FFFFFF;
            --bg-left: #F8FAFC;
            --bg-input: #F1F5F9;
            --border-color: #E2E8F0;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --btn-primary: #5A6A80;
            --btn-primary-hover: #475569;
            --danger-bg: #DC2626;
        }

        [data-theme="dark"] {
            --bg-primary: #18181B;
            --bg-card: #27272A;
            --bg-left: #202023;
            --bg-input: #3F3F46;
            --border-color: #3F3F46;
            --text-primary: #F4F4F5;
            --text-secondary: #A1A1AA;
            --text-muted: #94A3B8;
            --btn-primary: #475569;
            --btn-primary-hover: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Top Right Controls */
        .top-controls {
            position: absolute;
            top: 24px;
            right: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-select-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #166534;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #166534;
        }

        /* Main Card matching the exact image */
        .login-card {
            width: 760px;
            max-width: 92%;
            min-height: 450px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            display: flex;
            overflow: hidden;
        }

        /* Left Side Panel */
        .card-left {
            flex: 1;
            background: var(--bg-left);
            padding: 36px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border-right: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #334155;
            letter-spacing: -0.5px;
            margin-top: 8px;
        }

        [data-theme="dark"] .brand-title {
            color: #F4F4F5;
        }

        .shield-container {
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .top-secret-btn {
            background: var(--danger-bg);
            color: #FFFFFF;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 8px 18px;
            border-radius: 6px;
            text-transform: uppercase;
            border: none;
        }

        /* Right Side Form */
        .card-right {
            flex: 1.2;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s;
        }

        .input-group select {
            background-color: #FFFFFF;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748B%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 10px;
            padding-right: 32px;
        }

        [data-theme="dark"] .input-group select {
            background-color: var(--bg-input);
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #5A6A80;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--btn-primary);
            border: none;
            border-radius: 6px;
            color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--btn-primary-hover);
        }

        .forgot-link-wrapper {
            text-align: right;
            margin-top: 14px;
        }

        .forgot-link {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.15s;
        }

        .forgot-link:hover {
            color: var(--text-primary);
            text-decoration: underline;
        }

        @media (max-width: 680px) {
            .login-card {
                flex-direction: column;
                min-height: auto;
            }
            .card-left, .card-right {
                padding: 24px;
            }
            .top-controls {
                top: 12px;
                right: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Right Controls -->
    <div class="top-controls">
        <button class="theme-select-btn" onclick="toggleTheme()">
            <span id="themeLabel">Theme</span>
        </button>
        <div class="status-badge">
            <span class="dot"></span>
            <span>Connected</span>
        </div>
    </div>

    <!-- Exact Login Card -->
    <div class="login-card">
        <!-- Left Panel -->
        <div class="card-left">
            <h1 class="brand-title">ACIS-Core</h1>

            <div class="shield-container">
                <!-- Exact SVG Shield matching screenshot -->
                <svg width="84" height="100" viewBox="0 0 24 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 6V13C3 18.52 6.84 23.74 12 25C17.16 23.74 21 18.52 21 13V6L12 2Z" 
                          stroke="#5A6A80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <path d="M12 2V25C17.16 23.74 21 18.52 21 13V6L12 2Z" fill="#5A6A80" fill-opacity="0.15"/>
                </svg>
            </div>

            <button class="top-secret-btn">TOP SECRET</button>
        </div>

        <!-- Right Panel Form -->
        <div class="card-right">
            <h2 class="form-title">Operator Authentication</h2>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="" required value="admin@cyberimmune.ai">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required value="SecurePass123">
                </div>

                <div class="input-group">
                    <label for="role">Role clearance</label>
                    <select id="role">
                        <option value="">Select</option>
                        <option value="SecOps Administrator (Level 5)" selected>SecOps Administrator (Level 5)</option>
                        <option value="Cyber Analyst (Level 4)">Cyber Analyst (Level 4)</option>
                        <option value="Security Engineer (Level 3)">Security Engineer (Level 3)</option>
                        <option value="Observer (Level 2)">Observer (Level 2)</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit" id="loginBtn">Authenticate</button>
            </form>

            <div class="forgot-link-wrapper">
                <a href="#" class="forgot-link" onclick="quickLogin(); return false;">Forgot Password?</a>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('acis-theme', next);
        }

        const savedTheme = localStorage.getItem('acis-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Authenticating...';
            btn.disabled = true;

            const userData = {
                user: document.getElementById('username').value,
                email: document.getElementById('username').value,
                role: document.getElementById('role').value || 'SecOps Administrator'
            };

            try {
                const res = await fetch('http://127.0.0.1:5001/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                const data = await res.json();
                localStorage.setItem('user', JSON.stringify(data.success ? data : userData));
            } catch (err) {
                // If backend is offline, log in locally in demo mode
                localStorage.setItem('user', JSON.stringify(userData));
            }

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        });

        function quickLogin() {
            localStorage.setItem('user', JSON.stringify({ user: 'admin', role: 'SecOps Administrator' }));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
